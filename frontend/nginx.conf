server {
    listen 80;
    server_name localhost;

    # The chart of a large group is several MB of JSON: compressed, about ten times less.
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml;

    # Serve the React build
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Transparent proxy to the Go backend
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s; # fail fast when the backend is down
        # The first fetch of a large group walks many GitLab pages; later ones hit the cache.
        proxy_read_timeout 300s;
    }
}
