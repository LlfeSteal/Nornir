apiVersion: v1
kind: Pod
metadata:
  name: {{ include "nornir.fullname" . }}-test-connection
  labels:
    {{- include "nornir.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    # Through the frontend, so the nginx proxy to the backend is checked too.
    - name: wget
      image: busybox:1.36
      command: ["wget", "-q", "-O", "-", "http://{{ include "nornir.componentName" (list . "frontend") }}:{{ .Values.frontend.service.port }}/api/health"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
