{{- if and .Values.gitlab.token (not .Values.gitlab.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nornir.fullname" . }}
  labels:
    {{- include "nornir.labels" . | nindent 4 }}
type: Opaque
data:
  GITLAB_TOKEN: {{ .Values.gitlab.token | b64enc | quote }}
{{- end }}
