apiVersion: v1
kind: Service
metadata:
  name: {{ include "nornir.componentName" (list . "backend") }}
  labels:
    {{- include "nornir.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "nornir.selectorLabels" (list . "backend") | nindent 4 }}
