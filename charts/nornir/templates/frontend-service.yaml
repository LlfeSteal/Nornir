apiVersion: v1
kind: Service
metadata:
  name: {{ include "nornir.componentName" (list . "frontend") }}
  labels:
    {{- include "nornir.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (has .Values.frontend.service.type (list "NodePort" "LoadBalancer")) .Values.frontend.service.nodePort }}
      nodePort: {{ .Values.frontend.service.nodePort }}
      {{- end }}
  selector:
    {{- include "nornir.selectorLabels" (list . "frontend") | nindent 4 }}
